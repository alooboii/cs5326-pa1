[project]
name = "cs5326-pa1-modern-transformer"
version = "0.1.0"
description = "Test harness for CS 5326 Programming Assignment 1"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8,<1",
    "huggingface-hub>=0.34,<1",
    "jaxtyping>=0.3,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "tokenizers>=0.21,<1",
    "torch>=2.6,<3",
    "wrapt>=1.17,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
